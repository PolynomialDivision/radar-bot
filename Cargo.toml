[package]
name = "radar-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "radar-bot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
dashmap = "6"
# Feeds and pages in their declared charset (bodies are read in chunks, up to a cap).
encoding_rs = "0.8"
feed-rs = "2.3.1"
futures-util = "0.3"
mxbot-common = { git = "https://github.com/PolynomialDivision/mxbot-common", features = ["schedule", "sqlite"] }
# Article pages: the HTML parser behind the CSS selectors.
scraper = { version = "0.29", default-features = false }
# Feeding the parser in chunks against a deadline (the version scraper uses).
html5ever = "0.40"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "deflate", "brotli", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --dry-run: a scratch database, the fixture index, logs on stderr.
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# No panic = "abort" (unlike the other bots): panics are caught on purpose in
# each feed and each item (data from outside), one bad entry costs only itself.
# Its background loops still end the bot on a panic (mxbot_common::supervise).

[dev-dependencies]
# Tests of the live transport against a local server (fetch.rs only).
wiremock = "0.6"
