[package]
name = "radar-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "radar-bot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rusqlite = "0.37"
dashmap = "6"
chrono = "0.4"
futures-util = "0.3"
matrix-sdk = { version = "0.17", features = ["e2e-encryption", "sqlite", "automatic-room-key-forwarding"] }
matrix-sdk-crypto = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "deflate", "brotli", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mxbot-common = { git = "https://github.com/PolynomialDivision/mxbot-common" }
