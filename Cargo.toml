[package]
name = "radar-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "radar-bot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
dashmap = "6"
feed-rs = "2.3.1"
futures-util = "0.3"
mxbot-common = { git = "https://github.com/PolynomialDivision/mxbot-common" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "deflate", "brotli", "zstd"] }
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
